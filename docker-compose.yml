services:
  # ── FastAPI Server ──────────────────────────────────────────────────────────
  # Uses MongoDB Atlas (configured via server/.env). No local mongo container needed.
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cyventura_server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      # Override ALLOWED_ORIGINS to also allow the dockerized frontend
      - ALLOWED_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173", "http://localhost:3000"]
    volumes:
      - server_uploads:/app/uploads
    restart: unless-stopped

  # ── React Client ────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client/my-app
      dockerfile: Dockerfile
    container_name: cyventura_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_uploads:
